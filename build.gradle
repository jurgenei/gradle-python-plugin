plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
}

group = 'name.jurgenei.gradle'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

gradlePlugin {
    plugins {
        pythonRunner {
            id = 'name.jurgenei.gradle.python'
            implementationClass = 'name.jurgenei.gradle.python.PythonRunnerPlugin'
            displayName = 'Python Runner Plugin'
            description = 'Run Python scripts with per-project virtual environment and requirements caching.'
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Python Plugin'
                description = 'Gradle plugin for Python project integration'
                url = 'https://github.com/jurgenei/gradle-python-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'jurgenei'
                        name = 'Jurgen Hildebrand'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/jurgenei/gradle-python-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/jurgenei/gradle-python-plugin.git'
                    url = 'https://github.com/jurgenei/gradle-python-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

signing {
    required { gradle.taskGraph.hasTask("publish") }
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
